# shorts.shiipiit — intégration continue.
#
# Ce que cette CI protège, et pourquoi.
#
# L'application est conçue pour se dégrader en silence : sans variable vidéo elle
# affiche les vignettes de démonstration, sans Plausible elle ne mesure rien. Ce
# choix évite qu'un oubli de configuration mette le site à terre, mais il rend
# les régressions invisibles. La CI est donc le seul endroit où une erreur peut
# encore faire du bruit.
#
# Quatre contrôles, du moins cher au plus cher :
#   1. types      — `tsc` attrape les ruptures de contrat entre modules
#   2. lint       — règles Next.js, dont les pièges de rendu React
#   3. variables  — toute `process.env` lue doit être documentée
#   4. build      — le seul contrôle qui vérifie la frontière client/serveur :
#                   `server-only` fait échouer la compilation si un composant
#                   client importe `lib/video-admin.ts`, donc la clé d'API Bunny
#                   ne peut pas atteindre le navigateur sans que la CI le voie.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente,
# qui n'a plus d'intérêt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Types, lint, variables et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          # Aligné sur la version utilisée par Vercel : un écart de version
          # majeure produirait des échecs qui n'existent que sur l'un des deux.
          node-version: '24'
          cache: npm

      # `npm ci` plutôt que `npm install` : installe exactement le
      # package-lock.json, sans jamais le modifier. Une CI qui met à jour ses
      # propres dépendances ne teste pas ce qui sera déployé.
      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Vérifier la documentation des variables d'environnement
        run: npm run verif:env

      - name: Build de production
        run: npm run build
        env:
          # Valeurs de façade : le build ne doit dépendre d'aucun secret. Elles
          # servent seulement à emprunter les mêmes chemins de code qu'en
          # production — notamment la construction des URL de partage, qui
          # échouerait si `metadataBase` recevait une URL invalide.
          NEXT_PUBLIC_SITE_URL: https://shorts.shiipiit.com
          NEXT_PUBLIC_VIDEO_CDN_HOST: vz-exemple.b-cdn.net
